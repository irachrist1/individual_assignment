name: individual_assignment
description: "Kigali City Services & Places Directory"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State Management
  provider: ^6.1.2

  # Maps & Navigation
  google_maps_flutter: ^2.9.0
  url_launcher: ^6.3.1

  # Location
  geolocator: ^13.0.0

  # Local Storage (for notification preferences)
  shared_preferences: ^2.3.2

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
